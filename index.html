<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAFSA & Scholarship AI Advisor</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6fa;color:#172033;margin:0}
.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 22px #0000000d}
h1{margin:0 0 7px}.muted{color:#667085}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.mode{background:#eef1f7;color:#172033;border:0;padding:10px 13px;border-radius:9px;cursor:pointer;font-weight:700}
.mode.active{background:#172033;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #d2d8e4;border-radius:8px}
button.go{background:#172033;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}
#report{white-space:pre-wrap;line-height:1.55} @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="card"><h1>FAFSA & Scholarship AI Advisor</h1>
<p class="muted">Search scholarships, analyze a scholarship, research college aid, or build a funding plan.</p>
<div class="modes">
<button class="mode active" data-mode="scholarship">Analyze scholarship</button>
<button class="mode" data-mode="find">Find scholarships</button>
<button class="mode" data-mode="college">College aid</button>
<button class="mode" data-mode="athlete">Athletic + NIL</button>
<button class="mode" data-mode="plan">Funding plan</button>
</div>
</div>

<form id="form" class="card">
<div class="grid">
<div class="full"><label id="qlabel">Scholarship name</label>
<input id="query" name="query" placeholder="Coca-Cola Scholars Program" required></div>
<div><label>State</label><input name="state" placeholder="Texas"></div>
<div><label>College</label><input name="school" placeholder="UT Austin"></div>
<div><label>Major</label><input name="major" placeholder="Finance"></div>
<div><label>GPA</label><input name="gpa" placeholder="3.8"></div>
<div><label>Household income range</label><input name="income_range" placeholder="$75,000-$100,000"></div>
<div><label>Household size</label><input name="household_size" type="number" min="1"></div>
<div><label>Student-athlete?</label><select name="student_athlete"><option value="false">No</option><option value="true">Yes</option></select></div>
<div><label>Sport</label><input name="sport" placeholder="Track & field"></div>
<div><label>Recruiting status</label><input name="recruiting_status" placeholder="Recruiting / committed / current"></div>
<div class="full"><label>Other notes</label><textarea name="notes" rows="3" placeholder="Optional information that could affect eligibility."></textarea></div>
</div><br>
<button class="go">Research now</button><span id="status" class="muted"></span>
</form>

<div class="card"><h2>Research result</h2><div id="report">Your results will appear here.</div></div>
</div>
<script>
let mode="scholarship";
const label=document.getElementById("qlabel"), q=document.getElementById("query");
const placeholders={
 scholarship:["Scholarship name","Coca-Cola Scholars Program"],
 find:["What scholarships do you want?","Texas scholarships for finance students"],
 college:["College name","UT Austin"],
 athlete:["Sport / school / goal","Track & field scholarships at Texas colleges"],
 plan:["Funding goal","Maximize funding for UT Austin as a Texas finance student"]
};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 mode=b.dataset.mode;label.textContent=placeholders[mode][0];q.placeholder=placeholders[mode][1];
});
document.getElementById("form").onsubmit=async e=>{
 e.preventDefault();const btn=e.target.querySelector(".go");btn.disabled=true;
 document.getElementById("status").textContent=" Researching current official sources...";
 const d=Object.fromEntries(new FormData(e.target));d.mode=mode;
 d.household_size=d.household_size?Number(d.household_size):null;d.student_athlete=d.student_athlete==="true";
 try{const r=await fetch("/api/research",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
 const j=await r.json();if(j.error)throw Error(j.error);document.getElementById("report").textContent=j.report;
 document.getElementById("status").textContent=" Done.";
 }catch(x){document.getElementById("report").textContent="Error: "+x.message;document.getElementById("status").textContent=""}
 btn.disabled=false;
}
</script></body></html>
